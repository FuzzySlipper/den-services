bind_addr: "127.0.0.1:8100"
database_url_env: "DEN_BOARD_DATABASE_URL"
service_token_env: "DEN_BOARD_SERVICE_TOKEN"
adapter_identity: "authenticated-board-adapter"
projects_base_url_env: "DEN_PROJECTS_BASE_URL"
projects_token_env: "DEN_PROJECTS_SERVICE_TOKEN"
projects_request_timeout: "5s"
limits:
  default_page_size: 50
  max_page_size: 100
  max_path_comments: 50
  max_project_id_bytes: 256
  max_title_bytes: 512
  max_body_bytes: 65536
  max_author_identity_bytes: 256
  max_metadata_bytes: 16384
  max_search_query_bytes: 256
  max_purge_reason_bytes: 2000
http:
  read_header_timeout: "5s"
  max_request_body_bytes: 262144
