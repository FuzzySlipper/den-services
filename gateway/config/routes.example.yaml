# Deployable successor route table.
#
# Gateway is the only browser-facing API router. web-edge authenticates with
# DEN_GATEWAY_WEB_TOKEN, and Gateway replaces that caller credential with the
# owning service's token. Lane-specific callers keep their narrower tokens.

routes:
  - name: "review-project-task-routes"
    path_pattern: "/v1/projects/{project_id}/tasks/{task_id}/review"
    methods: ["GET", "POST"]
    legacy_upstream_url: "http://127.0.0.1:8096"
    successor_upstream_url: "http://127.0.0.1:8096"
    successor_mode: "always"
    caller_auth:
      bearer_token: "${DEN_GATEWAY_WEB_TOKEN}"
    successor_auth:
      bearer_token: "${DEN_GATEWAY_REVIEW_UPSTREAM_TOKEN}"

  - name: "review-project-routes"
    path_pattern: "/v1/projects/{project_id}/review"
