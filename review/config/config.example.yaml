bind_addr: "127.0.0.1:8096"
database_url_env: "DEN_REVIEW_DATABASE_URL"
service_token_env: "DEN_REVIEW_SERVICE_TOKEN"
allow_unauthenticated_local_dev: true
projects_base_url_env: "DEN_PROJECTS_BASE_URL"
projects_token_env: "DEN_PROJECTS_SERVICE_TOKEN"
tasks_base_url_env: "DEN_TASKS_BASE_URL"
tasks_token_env: "DEN_TASKS_SERVICE_TOKEN"
messages_base_url_env: "DEN_MESSAGES_BASE_URL"
messages_token_env: "DEN_MESSAGES_SERVICE_TOKEN"
http:
  read_header_timeout: "5s"
github:
  enabled: true
  api_base_url: "https://api.github.com"
  token_env: "DEN_REVIEW_GITHUB_TOKEN"
  poll_interval: "30s"
  scan_interval: "5s"
  missing_check_grace: "2m"
  request_timeout: "10s"
  default_timeout: "2h"
  max_timeout: "12h"
  batch_size: 10
  status_url_base: "http://127.0.0.1:8096"
  event_wait_max: "55s"
  event_wait_poll_interval: "500ms"
  # Most later commits of a gate's ref read when a required check is missing,
  # cancelled, or failed on the gated commit. Review picks later commits with a
  # passing or running Actions workflow run (nearest first) plus the ref head,
  # or the nearest commits plus the head when Actions is unreadable. A passing
  # run there satisfies the check. 0 disables later-commit satisfaction.
  later_commit_limit: 5
